extends: repetition
message: "'%s' is repeated!"
level: error
alpha: true
ignorecase: false
tokens:
  - '[^\s.!?]+'
exceptions:
  # numpydoc `Returns`/`Parameters` type lines are legitimately restated as
  # the first word of the following description, e.g.:
  #   pyvista.UnstructuredGrid
  #       UnstructuredGrid containing a single empty cell.
  - Actor
  - AddIDsAlgorithm
  - Brush
  - Camera
  - Chart
  - Color
  - CrinkleAlgorithm
  - DataFrame
  - Hexahedra
  - ImageData
  - Iterable
  - Iterator
  - Light
  - MultiBlock
  - Number
  - Path
  - Pen
  - Plotter
  - PolyData
  - RectilinearGrid
  - StructuredGrid
  - Table
  - Text
  - Texture
  - Theme
  - Trimesh
  - UnstructuredGrid
  - Any
  # dotted module paths like `pyvista.examples.examples.load_globe_texture`
  # and `pyvista.plotting.plotting` legitimately repeat their last segment.
  - examples
  - plotting
  # code example lines like `reader.reader.SetDataByteOrderToBigEndian()`
  # and `dataset = dataset.translate(...)` repeat a real identifier.
  - reader
  - dataset
  # two separate, correctly-labeled comments in the same list.
  - triangle
