extends: repetition
message: "'%s' is repeated!"
level: error
alpha: true
ignorecase: false
tokens:
  - '[^\s.!?]+'
exceptions:
  # numpydoc type lines restated as the first word of their description
  - Actor
  - AddIDsAlgorithm
  - Brush
  - Camera
  - Chart
  - Color
  - CrinkleAlgorithm
  - DataFrame
  - Hexahedra
  - ImageData
  - Iterable
  - Iterator
  - Light
  - MultiBlock
  - Number
  - Path
  - Pen
  - Plotter
  - PolyData
  - RectilinearGrid
  - StructuredGrid
  - Table
  - Text
  - Texture
  - Theme
  - Trimesh
  - UnstructuredGrid
  - Any
  # dotted module paths repeating their last segment, e.g. pyvista.examples.examples
  - examples
  - plotting
  # code repeating a real identifier, e.g. reader.reader.read()
  - reader
  - dataset
  # two separate, correctly-labeled comments
  - triangle
