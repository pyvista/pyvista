extends: capitalization
message: "'%s' should use title-style capitalization."
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: warning
scope: heading
match: $title
# Don't auto-exempt every vocab word (PyVista's Vocab is spelling-only content
# like widget/spline/arrays), which forces a single casing everywhere and
# breaks normal title-case on headings that use one of those words -- keep
# the curated list below instead.
vocab: false
indicators:
  - ":"
# Vale matches an exception as an unanchored pattern, so a bare `a` exempted
# every word containing the letter -- `calibration`, `camera` -- and silently
# turned this rule off for most headings. Anchor every entry to the start of a
# word so each one exempts only itself; the trailing `\b` still allows a
# possessive or an attached comma (`pytest's`, `glTF.`).
#
# Every entry below is load-bearing: removing it makes a heading in this
# repository fail. AP title case already lowercases `a` and `for`, and already
# leaves `PyVista` and `VTK` alone, so those need no entry.
exceptions:
  # These words should stay lower-case
  - ^are\b
  - ^from\b
  - ^is\b
  - ^like\b
  - ^to\b
  - ^with\b

  # Developer terms that should stay as-is
  - ^glTF\b
  - ^pytest\b
  - ^pyvista\.\w+\b # Allow the `pyvista.` namespace in headings
