[[redirects]]
force = true
from = "/version/stable/*"
status = 301
to = "/:splat"

[[redirects]]
force = true
from = "/version/dev/*"
status = 301
to = "https://dev.pyvista.org/:splat"

# pyvista.examples.load_*/download_* used to only be documented at
# pyvista.examples.examples.load_*/pyvista.examples.downloads.download_*;
# those pages no longer exist, so send old links to the public path they're
# now documented at instead.
[[redirects]]
force = true
from = "/api/examples/_autosummary/pyvista.examples.examples.*"
status = 301
to = "/api/examples/_autosummary/pyvista.examples.:splat"

[[redirects]]
force = true
from = "/api/examples/_autosummary/pyvista.examples.downloads.*"
status = 301
to = "/api/examples/_autosummary/pyvista.examples.:splat"

# pyvista.examples.vrml/download_3ds/gltf were deprecated and are no longer
# documented at all; redirect their old pages to the functions in
# pyvista.examples.downloads (now pyvista.examples) that replace them. There
# is no replacement for gltf.download_sheen_chair (removed, not renamed).
[[redirects]]
force = true
from = "/api/examples/_autosummary/pyvista.examples.vrml.download_teapot*"
status = 301
to = "/api/examples/_autosummary/pyvista.examples.download_teapot_vrml:splat"

[[redirects]]
force = true
from = "/api/examples/_autosummary/pyvista.examples.vrml.download_sextant*"
