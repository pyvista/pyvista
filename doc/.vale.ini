# Core settings
# =============

# Location of our `styles`
StylesPath = "styles"

# The options are `suggestion`, `warning`, or `error` (defaults to “warning”).
MinAlertLevel = warning

# WordTemplate specifies what Vale will consider to be an individual word.
WordTemplate = \b(?:%s)\b

# Define the vocabulary
Vocab = pyvista

[*.{md,rst}]

# Apply the following styles
BasedOnStyles = Vale, Google

# Google's product word list: it swaps terms with a technical meaning here
# ("check", "application") and bans "above" for earlier content.
Google.WordList = NO
# Flags the capital after a colon in "Term: Description" lists.
Google.Colons = NO

# Suggestion-level, so `MinAlertLevel` already hides them; off to say so.
# Acronyms flags standard domain terms (RGB, XYZ, PLY) and Semicolons flags
# correct semicolons; Contractions, Parens and Passive are style preferences
# that technical prose routinely departs from.
Google.Acronyms = NO
Google.Contractions = NO
Google.Parens = NO
Google.Passive = NO
Google.Semicolons = NO

# Reported as errors, not warnings, so none of these read as optional.
Google.Headings = error
Google.OxfordComma = error
Google.Ellipses = error
Google.FirstPerson = error
Google.Ranges = error
Google.HeadingPunctuation = error
Google.Spacing = error

# Our vocab has both PyVista/pyvista, VTK/vtk, etc., which Vale.Terms reads as
# an inconsistency.
Vale.Terms = NO

# ignore Jinja placeholders and sphinx roles; k3s, "12th IAPR ..." and
# "Image denoising by FFT" (citation titles), 1800s (a decade), na_0
# (Bohr radius, in a LaTeX .. math:: block Vale doesn't parse as math), and
# 404s (the HTTP status, not a number+unit) are false positives elsewhere.
# Dotted `pyvista.` names are identifiers, which Google.Spacing reads as two
# sentences with no space between them, and percentiles are written as numbers.
TokenIgnores = (?s){(.+?)}, :[a-z]+:`[^`]+`, k3s, 12th IAPR, Image denoising by FFT, 1800s, na_0, 404s, \bpyvista(?:\.\w+)+, \d+th percentile

[**/api/cli/**/*.rst]
# CLI titles use lower-case letters
Google.Headings = NO

[**/_templates/autosummary/*.rst]
# Jinja source templates, not reader-facing prose -- comments in them describe
# implementation details (e.g. Python identifiers like `getattr`/`objtype`) to
# maintainers, not to docs readers.
BasedOnStyles =

[*.py]

# Only check for the following:
# Repetition needs the extracted `.rst` (see below): a raw `.py` reaches the
# rule as plain text, where numpydoc type lines, `See Also` and doctest blocks
# all read as prose.
Vale.Repetition = NO
PyVista.Repetition = NO
Google.Exclamation = YES

[.vale/pyvista/**/*.rst]
# Same case-sensitivity issue as [*.py] -- these files are docstrings.
Vale.Repetition = NO
PyVista.Repetition = error

[**/vale/repetition*.rst]
# The `PyVista.Repetition` fixture; `repetition.rst` explains both halves.
Vale.Repetition = NO
PyVista.Repetition = error
