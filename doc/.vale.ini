# Core settings
# =============

# Location of our `styles`
StylesPath = "styles"

# The options are `suggestion`, `warning`, or `error` (defaults to “warning”).
MinAlertLevel = warning

# WordTemplate specifies what Vale will consider to be an individual word.
WordTemplate = \b(?:%s)\b

# Define the vocabulary
Vocab = pyvista

[*.{md,rst}]

# Apply the following styles
BasedOnStyles = Vale, Google

# Ignoring Google-specific rules - Not applicable under some circumstances
Google.WordList = NO
Google.Colons = NO
Google.Spacing = NO

# Reported as errors, not warnings, so none of these read as optional.
Google.Headings = error
Google.OxfordComma = error
Google.Ellipses = error
Google.FirstPerson = error
Google.Ranges = error
Google.HeadingPunctuation = error

# Our vocab has both PyVista/pyvista, VTK/vtk, etc., which Vale.Terms reads as
# an inconsistency.
Vale.Terms = NO

# ignore Jinja placeholders and sphinx roles; k3s, "12th IAPR ..." and
# "Image denoising by FFT" (citation titles), 1800s (a decade), na_0
# (Bohr radius, in a LaTeX .. math:: block Vale doesn't parse as math), and
# 404s (the HTTP status, not a number+unit) are false positives elsewhere.
TokenIgnores = (?s){(.+?)}, :[a-z]+:`[^`]+`, k3s, 12th IAPR, Image denoising by FFT, 1800s, na_0, 404s

[**/api/cli/**/*.rst]
# CLI titles use lower-case letters
Google.Headings = NO

[**/_templates/autosummary/*.rst]
# Jinja source templates, not reader-facing prose -- comments in them describe
# implementation details (e.g. Python identifiers like `getattr`/`objtype`) to
# maintainers, not to docs readers.
BasedOnStyles =

[*.py]

# Only check for the following:
# Repetition is checked on the extracted `.rst` instead (see the section
# below). Vale reads a `.py` file as plain text: numpydoc type lines, `See
# Also` entries and doctest blocks all reach the rule as prose, and each one
# restating a type name reads as a doubled word. The extractor blanks or skips
# all three, so the same rule run over its output needs no exceptions list.
Vale.Repetition = NO
PyVista.Repetition = NO
Google.Exclamation = YES

[.vale/pyvista/**/*.rst]
# Same case-sensitivity issue as [*.py] -- these files are docstrings.
Vale.Repetition = NO
PyVista.Repetition = error

[**/vale/repetition*.rst]
# The `PyVista.Repetition` fixture. `repetition.rst` is scanned and must pass;
# `repetition_invalid.rst` is not, and `check_expected_failures.py` asserts
# every case in it is still caught.
Vale.Repetition = NO
PyVista.Repetition = error
