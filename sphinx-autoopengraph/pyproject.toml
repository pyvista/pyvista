[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=77.0.3']

[project]
authors = [{ name = 'PyVista Developers', email = 'info@pyvista.org' }]
dependencies = ['sphinx>=7']
description = 'Automatic per-page Open Graph image and description selection for Sphinx, on top of sphinxext-opengraph.'
dynamic = ['version']
license = 'MIT'
name = 'sphinx-autoopengraph'
requires-python = '>=3.10'

[tool.setuptools.dynamic]
version = { attr = 'sphinx_autoopengraph.__version__' }

[tool.setuptools.packages.find]
include = ['sphinx_autoopengraph', 'sphinx_autoopengraph.*']
