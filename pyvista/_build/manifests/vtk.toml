manifest_version = 1

[backend]
default_ref = "v9.7.0" # newest release inside the vtk pin in pyproject.toml
import_name = "vtkmodules"
name = "vtk"
url = "https://gitlab.kitware.com/vtk/vtk.git"

[tools]
cmake = ">=3.22"
ninja = ">=1.11"

[manylinux]
packages = ["libX11-devel", "libXcursor-devel", "mesa-libGL-devel"]

[cmake]
common = [
  "VTK_BUILD_DOCUMENTATION=OFF",
  "VTK_BUILD_EXAMPLES=OFF",
  "VTK_BUILD_TESTING=OFF",
  "VTK_DISPATCH_SOA_ARRAYS=ON",
  "VTK_JPEG_ENABLE_SIMD=ON",
  "VTK_USE_PCH=OFF", # a precompiled header defeats the compiler cache
  "VTK_WHEEL_BUILD=ON",
  "VTK_WRAP_PYTHON=ON",
]
macos = ["CMAKE_OSX_DEPLOYMENT_TARGET=11.0"]

[groups.rendering]
cmake = ["VTK_GROUP_ENABLE_Rendering=WANT"]
cmake_off = ["VTK_GROUP_ENABLE_Rendering=NO", "VTK_GROUP_ENABLE_Views=NO"]
default = true
help = "OpenGL rendering, widgets, charts and text"

[groups.io]
cmake = [
  "VTK_MODULE_ENABLE_VTK_IOImport=YES",
  "VTK_MODULE_ENABLE_VTK_IOParallelExodus=YES",
  "VTK_MODULE_ENABLE_VTK_IOXdmf2=YES",
]
default = true
help = "Extra readers and writers (scene import, Exodus, Xdmf2)"

[groups.web]
cmake = [
  "VTK_MODULE_ENABLE_VTK_WebCore=YES",
  "VTK_MODULE_ENABLE_VTK_WebGLExporter=YES",
  "VTK_MODULE_ENABLE_VTK_WebPython=YES",
]
default = true
help = "Web export modules used by trame and the Jupyter backends"

[groups.matplotlib]
cmake = ["VTK_MODULE_ENABLE_VTK_RenderingMatplotlib=YES"]
default = true
help = "Matplotlib-rendered math text and labels"

[groups.parallel]
cmake = ["VTK_MODULE_ENABLE_VTK_FiltersParallelDIY2=YES"]
default = true
help = "DIY2-based parallel filters (e.g. redistribution, ghost cells)"

[groups.serialization]
cmake = ["VTK_BUILD_PYI_FILES=ON", "VTK_WRAP_SERIALIZATION=ON"]
default = true
help = "Object serialization and .pyi stub files"

[groups.headless-egl]
cmake = [
  "VTK_DEFAULT_RENDER_WINDOW_HEADLESS=ON",
  "VTK_OPENGL_HAS_EGL=ON",
  "VTK_USE_X=OFF",
]
conflicts = ["headless-osmesa"]
default = false
help = "Off-screen GPU rendering through EGL instead of X (Linux)"
os = ["linux"]

[groups.headless-osmesa]
cmake = [
  "VTK_DEFAULT_RENDER_WINDOW_HEADLESS=ON",
  "VTK_OPENGL_HAS_OSMESA=ON",
  "VTK_USE_X=OFF",
]
conflicts = ["headless-egl"]
default = false
help = "Off-screen software rendering through OSMesa instead of X (Linux)"
os = ["linux"]

[options.smp]
choices = ["OpenMP", "STDThread", "Sequential", "TBB"]
cmake = "VTK_SMP_IMPLEMENTATION_TYPE={value}"
default = "STDThread" # what the PyPI wheels use; VTK's own default is Sequential
help = "Threading backend for SMP-enabled filters"
