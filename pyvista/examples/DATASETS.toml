# Provenance for the example files in this directory and for the examples fetched
# from hosts other than pyvista/data, in the same schema as the DATASETS.toml
# published by pyvista/data, whose CONTRIBUTING.md documents how to establish and
# check an entry. See _dataset_metadata.py for the reader.

schema_version = 1

[license."CC-BY-4.0"]
attribution_required = true
commercial_use = true
file = "LICENSES/CC-BY-4.0.txt"
share_alike = false
text_source = "https://spdx.org/licenses/CC-BY-4.0.json"
title = "Creative Commons Attribution 4.0 International"
url = "https://creativecommons.org/licenses/by/4.0/"

[license."CC-BY-NC-4.0"]
attribution_required = true
commercial_use = false
file = "https://spdx.org/licenses/CC-BY-NC-4.0.txt"
share_alike = false
text_source = "https://spdx.org/licenses/CC-BY-NC-4.0.json"
title = "Creative Commons Attribution Non Commercial 4.0 International"
url = "https://creativecommons.org/licenses/by-nc/4.0/"

[license."CC0-1.0"]
attribution_required = false
commercial_use = true
file = "LICENSES/CC0-1.0.txt"
share_alike = false
text_source = "https://spdx.org/licenses/CC0-1.0.json"
title = "Creative Commons Zero v1.0 Universal"
url = "https://creativecommons.org/publicdomain/zero/1.0/"

[license."MIT"]
attribution_required = true
commercial_use = true
file = "https://github.com/pyvista/pyvista/blob/main/LICENSE"
share_alike = false
text_source = "https://spdx.org/licenses/MIT.json"
title = "MIT License"
url = "https://opensource.org/licenses/MIT"

[license."LicenseRef-LBNL-WholeFrog"]
attribution_required = true
commercial_use = false
file = "LICENSES/LicenseRef-LBNL-WholeFrog.txt"
share_alike = false
text_source = "https://froggy.lbl.gov/images/whole.frog/data/Copyright.Notice"
title = "Lawrence Berkeley National Laboratory Whole Frog Project data terms"
url = "https://froggy.lbl.gov/images/whole.frog/data/"

[license."LicenseRef-Unknown"]
attribution_required = false
commercial_use = false
file = "LICENSES/LicenseRef-Unknown.txt"
share_alike = false
text_source = "Written for this repository; the file states what it is based on."
title = "Undetermined license"
url = "https://github.com/pyvista/data/blob/master/LICENSES/LicenseRef-Unknown.txt"

[collection."khronos-gltf-sample-models"]
description = "Sample glTF 2.0 assets published by the Khronos Group, each with its own licence stated in a README beside the files."
title = "Khronos glTF Sample Models"
url = "https://github.com/KhronosGroup/glTF-Sample-Models"

[collection."pyvista"]
description = "Datasets authored by the PyVista project and distributed inside the package."
title = "PyVista"
url = "https://github.com/pyvista/pyvista"

[collection."solar-system-scope"]
description = "Planetary surface and sky textures published by Solar System Scope."
title = "Solar System Scope Textures"
url = "https://www.solarsystemscope.com/textures/"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
description = "Triangulated surface mesh of an airplane, 1335 points and 2452 faces, in ASCII PLY format."
name = "airplane"
notes = """
Present in the first commit of this project, in May 2017, with no recorded
source. Unlike the other PLY files here it carries no `VTK generated PLY File`
comment, so it was not produced by the project and came from somewhere that
was never written down.
"""
path = ["airplane.ply"]
provenance = "unknown"
title = "Airplane"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
description = "Triangulated surface mesh of an ant, 486 points and 912 faces."
name = "ant"
notes = """
Present in the first commit of this project, in May 2017, with no recorded
source. Its header reads `VTK generated PLY File`, so the copy here was
written by VTK, but the mesh it was written from is not recorded.
"""
path = ["ant.ply"]
provenance = "unknown"
title = "Ant"

[[dataset]]
SPDX-License-Identifier = "CC0-1.0"
attribution = "Avocado by Microsoft (https://github.com/KhronosGroup/glTF-Sample-Models/tree/main/2.0/Avocado), dedicated to the public domain under CC0 1.0."
authors = ["Microsoft"]
collection = "khronos-gltf-sample-models"
description = "Textured surface model of an avocado, a Khronos glTF sample asset, in binary glTF form."
name = "avocado"
origin_title = "Khronos glTF Sample Models, Avocado"
origin_url = "https://github.com/KhronosGroup/glTF-Sample-Models/tree/main/2.0/Avocado"
path = ["Avocado/glTF-Binary/Avocado.glb"]
provenance = "verified"
title = "Avocado"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
description = "Facies model of fluvial channels in the subsurface, on a 251 by 251 by 101 uniform grid."
name = "channels"
notes = """
Added in February 2019 with the commit message "add channels example for
volume analysis" and no recorded source. The single array is named `facies`,
which places it in geostatistics, channel training images of this shape are
widely circulated in that field, but the specific model was not identified.
"""
path = ["channels.vti"]
provenance = "unknown"
title = "Fluvial channels"

[[dataset]]
SPDX-FileCopyrightText = ["2016 theblueturtle_", "2018 ctxwing"]
SPDX-License-Identifier = "CC-BY-4.0 AND CC-BY-NC-4.0"
attribution = "Battle Damaged Sci-fi Helmet - PBR by theblueturtle_ (https://sketchfab.com/theblueturtle_), CC BY-NC 4.0; rebuilt and converted to glTF by ctxwing, CC BY 4.0."
authors = ["ctxwing", "theblueturtle_"]
collection = "khronos-gltf-sample-models"
description = "Textured surface model of a battle-damaged science fiction helmet, a Khronos glTF sample asset, in embedded glTF form."
name = "damaged_helmet"
notes = """
The README beside the file names a Creative Commons Attribution-NonCommercial
licence without a version; the successor repository, glTF-Sample-Assets, records
the versions used here. The non-commercial term follows the model into any use.
"""
origin_title = "Khronos glTF Sample Models, DamagedHelmet"
origin_url = "https://github.com/KhronosGroup/glTF-Sample-Models/tree/main/2.0/DamagedHelmet"
path = ["DamagedHelmet/glTF-Embedded/DamagedHelmet.gltf"]
provenance = "verified"
title = "Damaged helmet"

[[dataset]]
SPDX-FileCopyrightText = ["Solar System Scope (INOVE)"]
SPDX-License-Identifier = "CC-BY-4.0"
attribution = "Texture by Solar System Scope, https://www.solarsystemscope.com/textures/, licensed under CC BY 4.0."
collection = "solar-system-scope"
description = "Equirectangular daytime surface texture of the Earth at 2048 by 1024, applied to the globe mesh."
name = "earth_texture"
notes = """
Byte-identical to the `2k_earth_daymap.jpg` published by Solar System Scope,
which is the same source as the `solar_textures` datasets that
`pyvista.examples.planets` downloads. The licence requires attribution.
"""
origin_title = "Solar System Scope Textures"
origin_url = "https://www.solarsystemscope.com/textures/"
path = ["2k_earth_daymap.jpg"]
provenance = "verified"
title = "Earth day map"

[[dataset]]
SPDX-FileCopyrightText = ["Lawrence Berkeley Laboratory"]
SPDX-License-Identifier = "LicenseRef-LBNL-WholeFrog"
attribution = "Whole Frog Project, Lawrence Berkeley National Laboratory (https://froggy.lbl.gov/), images and data by Bill Johnston and Wing Nip; provided for scientific research, commercial use requires prior agreement with the laboratory."
authors = ["Bill Johnston", "Wing Nip"]
description = "Tissue segmentation labels for the frog volume, 500 by 470 by 136 voxels, with 25 non-zero label values between 1 and 29."
modification = "Converted from the MetaImage pair `froggy/frogtissue.mhd` and `froggy/frogtissue.zraw` to VTK XML ImageData."
modified = true
name = "frog_tissues"
notes = """
Saved from `Data/froggy/frogtissue.mhd` and `frogtissue.zraw` in pyvista/data
by pyvista/pyvista#6110 (merged June 2024), whose description states the
conversion: "The dataset is saved as a `.vti` file instead of the original
`.mhd` and `.zraw` files". The dimensions (500 by 470 by 136), spacing
(1, 1, 1.5) and element type (unsigned 8-bit) match that header. The file
holds 26 distinct values: 0 and 25 labels between 1 and 29.

That volume is the Lawrence Berkeley National Laboratory Whole Frog Project
frog, whose `frog` entry in pyvista/data records the laboratory's terms:
provided for scientific research, with commercial use requiring the
laboratory's prior agreement. It reached pyvista/data in April 2019 from
`src/Testing/Data/Frog` in `lorensen/VTKExamples`.
"""
origin_title = "LBNL Whole Frog Project, slice image data"
origin_url = "https://froggy.lbl.gov/images/whole.frog/data/"
path = ["frog_tissues.vti"]
provenance = "verified"
redistributed_from = [
  "https://github.com/lorensen/VTKExamples/tree/master/src/Testing/Data/Frog",
  "https://github.com/pyvista/data/tree/master/Data/froggy",
]
title = "Frog tissue labels"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
collection = "khronos-gltf-sample-models"
description = "Surface model of a gearbox assembly, a Khronos glTF sample asset, in binary glTF form."
name = "gearbox"
notes = """
The README beside the file says only that Okino Computer Graphics converted the
model from JT to COLLADA for Khronos; it names no author and states no terms,
and the successor repository, glTF-Sample-Assets, does not list the model. Ask
the Khronos Group before using it for more than running the example.
"""
origin_title = "Khronos glTF Sample Models, GearboxAssy"
origin_url = "https://github.com/KhronosGroup/glTF-Sample-Models/tree/main/2.0/GearboxAssy"
path = ["GearboxAssy/glTF-Binary/GearboxAssy.glb"]
provenance = "verified"
title = "Gearbox assembly"

