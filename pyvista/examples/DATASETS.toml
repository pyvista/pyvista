# Provenance for the example files in this directory, in the same schema as the
# DATASETS.toml published by pyvista/data, whose CONTRIBUTING.md documents how
# to establish and check an entry. See _dataset_metadata.py for the reader.

schema_version = 1

[license."BSD-3-Clause"]
attribution_required = true
commercial_use = true
file = "https://github.com/pyvista/data/blob/master/LICENSES/BSD-3-Clause.txt"
share_alike = false
title = "BSD 3-Clause \"New\" or \"Revised\" License"
url = "https://opensource.org/licenses/BSD-3-Clause"

[license."CC-BY-4.0"]
attribution_required = true
commercial_use = true
file = "https://github.com/pyvista/data/blob/master/LICENSES/CC-BY-4.0.txt"
share_alike = false
title = "Creative Commons Attribution 4.0 International"
url = "https://creativecommons.org/licenses/by/4.0/"

[license."MIT"]
attribution_required = true
commercial_use = true
file = "https://github.com/pyvista/pyvista/blob/main/LICENSE"
share_alike = false
title = "MIT License"
url = "https://opensource.org/licenses/MIT"

[license."LicenseRef-Unknown"]
attribution_required = false
commercial_use = false
file = "https://github.com/pyvista/data/blob/master/LICENSES/LicenseRef-Unknown.txt"
share_alike = false
title = "Undetermined license"
url = "https://github.com/pyvista/data/blob/master/LICENSES/LicenseRef-Unknown.txt"

[collection."pyvista"]
description = "Datasets authored by the PyVista project and distributed inside the package."
title = "PyVista"
url = "https://github.com/pyvista/pyvista"

[collection."vtk-data"]
description = "Kitware's test and example data collection for the Visualization Toolkit."
title = "VTK Data"
url = "https://gitlab.kitware.com/vtk/vtk-data"

[collection."solar-system-scope"]
description = "Planetary surface and sky textures published by Solar System Scope."
title = "Solar System Scope Textures"
url = "https://www.solarsystemscope.com/textures/"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
description = "Triangulated surface mesh of an airplane, 1335 points and 2452 faces, in ASCII PLY format."
name = "airplane"
notes = """
Present in the first commit of this project, in May 2017, with no recorded
source. Unlike the other PLY files here it carries no `VTK generated PLY File`
comment, so it was not produced by the project and came from somewhere that
was never written down.
"""
path = ["airplane.ply"]
provenance = "unknown"
title = "Airplane"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
description = "Triangulated surface mesh of an ant, 486 points and 912 faces."
name = "ant"
notes = """
Present in the first commit of this project, in May 2017, with no recorded
source. Its header reads `VTK generated PLY File`, so the copy here was
written by VTK, but the mesh it was written from is not recorded.
"""
path = ["ant.ply"]
provenance = "unknown"
title = "Ant"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
description = "Facies model of fluvial channels in the subsurface, on a 251 by 251 by 101 uniform grid."
name = "channels"
notes = """
Added in February 2019 with the commit message "add channels example for
volume analysis" and no recorded source. The single array is named `facies`,
which places it in geostatistics — channel training images of this shape are
widely circulated in that field — but the specific model was not identified.
"""
path = ["channels.vti"]
provenance = "unknown"
title = "Fluvial channels"

[[dataset]]
SPDX-FileCopyrightText = ["Solar System Scope (INOVE)"]
SPDX-License-Identifier = "CC-BY-4.0"
attribution = "Texture by Solar System Scope, https://www.solarsystemscope.com/textures/, licensed under CC BY 4.0."
collection = "solar-system-scope"
description = "Equirectangular daytime surface texture of the Earth at 2048 by 1024, applied to the globe mesh."
name = "earth_texture"
notes = """
Byte-identical to the `2k_earth_daymap.jpg` published by Solar System Scope,
which is the same source as the `solar_textures` datasets that
`pyvista.examples.planets` downloads. The licence requires attribution.
"""
path = ["2k_earth_daymap.jpg"]
provenance = "verified"
source_title = "Solar System Scope Textures"
source_url = "https://www.solarsystemscope.com/textures/"
title = "Earth day map"

[[dataset]]
SPDX-FileCopyrightText = ["1993-2008 Ken Martin, Will Schroeder, Bill Lorensen"]
SPDX-License-Identifier = "BSD-3-Clause"
attribution = "VTK Data. Copyright (c) 1993-2008 Ken Martin, Will Schroeder, Bill Lorensen. BSD 3-Clause."
collection = "vtk-data"
description = "Tissue segmentation labels for the frog volume, 500 by 470 by 136 voxels with 30 label values."
modification = "Converted from the MetaImage pair `froggy/frogtissue.mhd` and `froggy/frogtissue.zraw` to VTK XML ImageData."
modified = true
name = "frog_tissues"
notes = """
The dimensions, spacing, element type and array name all match
`Data/froggy/frogtissue.mhd` in the pyvista/data repository, so this is a
conversion of the VTK Data frog volume rather than a separate scan. The same
caveat applies as to that dataset: Kitware never published per-file
provenance for it.
"""
path = ["frog_tissues.vti"]
provenance = "inferred"
source_title = "VTK Data"
source_url = "https://gitlab.kitware.com/vtk/vtk-data"
title = "Frog tissue labels"

[[dataset]]
SPDX-FileCopyrightText = ["2017-2026 The PyVista Developers"]
SPDX-License-Identifier = "MIT"
attribution = "PyVista, MIT License."
collection = "pyvista"
description = "Sphere carrying texture coordinates, for draping the Earth day map over."
name = "globe"
notes = """
Generated by the project in January 2019 alongside the Earth texture, in the
commit that added texture support. It carries only texture coordinates, no
data of its own.
"""
path = ["globe.vtk"]
provenance = "verified"
source_title = "PyVista"
source_url = "https://github.com/pyvista/pyvista"
title = "Globe"

[[dataset]]
SPDX-FileCopyrightText = ["2017-2026 The PyVista Developers"]
SPDX-License-Identifier = "MIT"
attribution = "PyVista, MIT License."
collection = "pyvista"
description = "Cantilever beam of 40 hexahedral cells and 99 points, with sample point and cell scalars."
name = "hexbeam"
notes = "Present in the first commit of this project, in May 2017. A generated beam mesh rather than data from elsewhere: its arrays are named `sample_point_scalars` and `sample_cell_scalars`."
path = ["hexbeam.vtk"]
provenance = "verified"
source_title = "PyVista"
source_url = "https://github.com/pyvista/pyvista"
title = "Hexahedral beam"

[[dataset]]
SPDX-FileCopyrightText = ["2017-2026 The PyVista Developers"]
SPDX-License-Identifier = "MIT"
attribution = "PyVista, MIT License."
collection = "pyvista"
description = "The PyVista logo as a raster image."
name = "logo"
path = ["pyvista_logo.png"]
provenance = "verified"
source_title = "PyVista"
source_url = "https://github.com/pyvista/pyvista/tree/main/doc/source/_static"
title = "PyVista logo"

[[dataset]]
SPDX-License-Identifier = "LicenseRef-Unknown"
description = "Surface mesh of a hex nut, 523 points and 1046 faces, used to demonstrate sharp-edge splitting."
name = "nut"
notes = """
Added in December 2021 by the pull request that introduced `split_sharp_edges`
to `add_mesh`, which describes what the mesh demonstrates but not where it
came from. Its header reads `VTK generated PLY File`, and its bounds place it
away from the origin, so it appears to have been cut from a larger model that
is not recorded. It is unrelated to the `nut.slc` volume in pyvista/data,
whose bounds do not match.
"""
path = ["nut.ply"]
provenance = "unknown"
title = "Nut"

[[dataset]]
SPDX-FileCopyrightText = ["2017-2026 The PyVista Developers"]
SPDX-License-Identifier = "MIT"
attribution = "PyVista, MIT License."
collection = "pyvista"
description = "Rectilinear grid of 27 by 28 by 24 points carrying a random scalar field."
name = "rectilinear"
notes = "Added in December 2018 with the commit message \"Add example files\". Its only array is named `Random Data`, so it is generated rather than measured."
path = ["rectilinear.vtk"]
provenance = "verified"
source_title = "PyVista"
source_url = "https://github.com/pyvista/pyvista"
title = "Rectilinear grid"

[[dataset]]
SPDX-FileCopyrightText = ["2017-2026 The PyVista Developers"]
SPDX-License-Identifier = "MIT"
attribution = "PyVista, MIT License."
collection = "pyvista"
description = "Triangulated sphere of 422 points and 840 faces."
name = "sphere"
notes = "Present in the first commit of this project, in May 2017. A generated sphere written by VTK, carrying no data."
path = ["sphere.ply"]
provenance = "verified"
source_title = "PyVista"
source_url = "https://github.com/pyvista/pyvista"
title = "Sphere"

[[dataset]]
SPDX-FileCopyrightText = ["2017-2026 The PyVista Developers"]
SPDX-License-Identifier = "MIT"
attribution = "PyVista, MIT License."
collection = "pyvista"
description = "Uniform grid of 10 by 10 by 10 points with sample point and cell scalars."
name = "uniform"
notes = "Added in December 2018 with the commit message \"Add example files\". Its arrays are named `Spatial Point Data` and `Spatial Cell Data`, so it is generated."
path = ["uniform.vtk"]
provenance = "verified"
source_title = "PyVista"
source_url = "https://github.com/pyvista/pyvista"
title = "Uniform grid"
