name: Unit Tests

# zizmor ignore note: All caching for pushes to main should be disabled with the `USE_CACHE` env var
on: # zizmor: ignore[cache-poisoning]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs started by the schedule or by hand never cancel an in-progress run, so a merge to
  # `main` always finishes; they queue behind it, and are dropped if another merge arrives.
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  ALLOW_PLOTTING: true
  SHELLOPTS: "errexit:pipefail"
  TOX_COLORED: "yes"
  USE_CACHE: ${{
    (
    (github.event_name == 'workflow_dispatch' && github.event.inputs.cache == 'true') ||
    (github.event_name == 'pull_request') ||
    (github.event_name == 'push')
    ) &&
    !startsWith(github.ref, 'refs/tags/v') &&
    !startsWith(github.ref, 'refs/heads/release/') &&
    !startsWith(github.ref, 'refs/heads/main')
    }}

permissions:
  id-token: none

jobs:
  # Save the PR number as an artifact so the separate deploy workflow (triggered
  # via workflow_run) can associate the build with its PR — workflow_run events
  # do not include pull_request data for fork PRs. Nothing else goes in here:
  # the deploy workflow takes the head SHA and fork status from its own event.
  pr-info:
    name: Save PR info
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-info
          printf '%s' "$PR_NUMBER" > pr-info/pr_number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pr-info
          path: pr-info/

  # Cache pyvista/data for each runner separately
  # Runner labels should match the actual runners used by the different jobs in this file

  # GitHub-hosted runners can re-use the cache across OS's.
  # Here we run the cache on ubuntu, but it's usable by the Windows and macOS
  # GitHub runners too, via enableCrossOsArchive on the restore.
  cache-github-hosted:
    name: Cache pyvista/data
    uses: $/.github/workflows/cache-pyvista-data.yml
    with:
      runs-on: "ubuntu-22.04"

  # Check names render as `macOS / 3.11`, and are required status checks on main.
  macOS:
    # The merge queue runs this suite against the exact tree that lands, and
    # nothing downstream of a push to `main` consumes its output, so it is only
    # repeated for a tag, where `release` gates on it.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    needs: cache-github-hosted
    uses: $/.github/workflows/unit-tests.yml
    with:
      label: macOS
      os: macos-latest
      data-key: ${{ needs.cache-github-hosted.outputs.key }}
      # macOS runner minutes bill at ten times the Linux rate, so a hung job is
      # expensive at the 360-minute default. The suite finishes in ~15.
      timeout-minutes: 80
      # Keep to 2 entries, the oldest and newest Python: GitHub-hosted macOS runners are a limited shared pool and bottleneck this workflow.
      rows: >-
        [
          {"python": "3.11"},
          {"python": "3.14"}
        ]

  Linux:
    # Repeated for a tag only, like the other two. The merge queue's own commit
    # is the one that lands, so the coverage it uploads is already Codecov's
    # report for `main` and the push has nothing left to add.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    needs: cache-github-hosted
    uses: $/.github/workflows/unit-tests.yml
    with:
      label: Linux
      os: ubuntu-22.04
      data-key: ${{ needs.cache-github-hosted.outputs.key }}
      coverage: true
      # see discussion at https://github.com/pyvista/pyvista/issues/2867
      rows: >-
        [
          {"python": "3.11", "vtk": "9.3.1"},
          {"python": "3.11", "vtk": "9.4.2"},
          {"python": "3.12", "vtk": "9.5.2"},
          {"python": "3.13", "vtk": "9.6.2"},
          {"python": "3.14", "vtk": "latest"}
        ]

  Windows:
    # Repeated for a tag only, for the same reason as the macOS suite.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    needs: cache-github-hosted
    uses: $/.github/workflows/unit-tests.yml
    with:
      label: Windows
      os: windows-latest
      data-key: ${{ needs.cache-github-hosted.outputs.key }}
      timeout-minutes: 80
      retries: 3
      core-timeout: 12
      plotting-timeout: 30
      rows: >-
        [
          {"python": "3.11"},
          {"python": "3.12"},
          {"python": "3.13"},
          {"python": "3.14"}
        ]

  check-package:
    name: Check package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check package
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

  # The test image report Netlify deploy lives in test-image-report-deploy.yml,
  # triggered via workflow_run, so fork PR CI is never blocked on deployment
  # approval.

  upload-coverage-:
    name: Upload coverage reports
    runs-on: ubuntu-22.04
    needs: Linux
    # Run on push/merge_group as well as pull_request so Codecov's
    # main-branch baseline keeps advancing with every merge.
    permissions:
      # id-token: write authorizes OIDC token minting so codecov-action can
      # authenticate to Codecov without a long-lived CODECOV_TOKEN secret.
      id-token: write
      contents: read
    steps:
      # Needs to checkout only for codecov to match file names
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage_reports-*
          path: coverage_reports

      # Each matrix cell contributes one report per side, each uploaded under its own flag.
      - name: Sort reports by flag
        run: |
          mkdir -p flag_package flag_tests
          find coverage_reports -name 'coverage_package_*.xml' -exec mv {} flag_package/ \;
          find coverage_reports -name 'coverage_tests_*.xml' -exec mv {} flag_tests/ \;
          ls flag_package flag_tests

      - name: Upload pyvista coverage to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          directory: flag_package
          flags: package
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload test coverage to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          directory: flag_tests
          flags: tests
          fail_ci_if_error: true
          use_oidc: true

  # Publish to PyPI using trusted publishing
  release:
    name: Release
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [Linux, Windows, macOS, check-package]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyvista
    permissions:
      id-token: write # this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload to PyPi
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
