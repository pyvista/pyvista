name: Unit Tests

# zizmor ignore note: All caching for pushes to main should be disabled with the `USE_CACHE` env var
on: # zizmor: ignore[cache-poisoning]
  workflow_call:
    inputs:
      label:
        description: Caller job id, used in artifact names and failure summaries.
        required: true
        type: string
      os:
        description: Runner label.
        required: true
        type: string
      rows:
        description: >-
          JSON list of matrix rows, each with `python` and optionally the `vtk` and `numpy`
          tox factor versions. A `vtk` of `local` installs the VTK wheel built earlier in the run.
        required: true
        type: string
      data-key:
        description: Cache key output by cache-pyvista-data.yml.
        required: true
        type: string
      coverage:
        description: Run the `cov` tox factor and upload the coverage reports as artifacts.
        default: false
        type: boolean
      retries:
        description: Attempts per test step when it times out.
        default: 1
        type: number
      core-timeout:
        description: Minutes per core test attempt.
        default: 60
        type: number
      plotting-timeout:
        description: Minutes per plotting test attempt.
        default: 120
        type: number
      timeout-minutes:
        description: Minutes for the whole job.
        default: 360
        type: number

env:
  ALLOW_PLOTTING: true
  SHELLOPTS: "errexit:pipefail"
  TOX_COLORED: "yes"
  PARALLEL: "-n auto" # Use all available cores on the selected runner
  CI_WINDOWS: ${{ startsWith(inputs.os, 'windows') }}
  VTK_WHEEL_DIR: ${{ github.workspace }}/vtk-wheel
  USE_CACHE: ${{
    (
    (github.event_name == 'workflow_dispatch' && github.event.inputs.cache == 'true') ||
    (github.event_name == 'pull_request') ||
    (github.event_name == 'push')
    ) &&
    !startsWith(github.ref, 'refs/tags/v') &&
    !startsWith(github.ref, 'refs/heads/release/') &&
    !startsWith(github.ref, 'refs/heads/main')
    }}

jobs:
  test:
    # The failure summary's `job-name` below repeats this expression and must match it.
    name: >-
      ${{ format('{0}{1}{2}',
        matrix.python,
        matrix.vtk && format(', vtk {0}', matrix.vtk) || '',
        matrix.numpy && format(', numpy {0}', matrix.numpy) || '') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.rows) }}
    env:
      TOX_ENV: >-
        ${{ format('py{0}{1}{2}{3}',
          matrix.python,
          matrix.numpy && format('-numpy_{0}', matrix.numpy) || '',
          matrix.vtk && format('-vtk_{0}', matrix.vtk) || '',
          inputs.coverage && '-cov' || '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: ${{ env.USE_CACHE == 'true' && 'pip' || '' }}

      - name: Download VTK wheel artifact
        if: matrix.vtk == 'local'
        id: download-wheel
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vtk-wheel-${{ runner.os }}-py${{ matrix.python }}
          path: vtk-wheel

      - name: Skip if wheel build failed
        if: matrix.vtk == 'local' && steps.download-wheel.outcome != 'success'
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          echo "No VTK wheel artifact for $RUNNER_OS/py$PYTHON_VERSION"
          exit 1

      - name: Set up headless display
        if: runner.os != 'macOS'
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79

      - if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: libosmesa6
          version: 3.0

      - name: Restore pyvista/data cache
        uses: $/.github/actions/restore-pyvista-data
        with:
          key: ${{ inputs.data-key }}

      - name: Install tox-uv
        run: pip install tox-uv

      # `shell: bash`: this action's Windows default is PowerShell. Teed for the failure summary.
      - name: Core Testing (no GL)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: ${{ inputs.core-timeout }}
          max_attempts: ${{ inputs.retries }}
          retry_on: timeout
          shell: bash
          command: tox run -e "$TOX_ENV-core" 2>&1 | tee core-test.log

      - name: Plotting Testing (uses GL)
        if: ${{ !cancelled() }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: ${{ inputs.plotting-timeout }}
          max_attempts: ${{ inputs.retries }}
          retry_on: timeout
          shell: bash
          command: tox run -e "$TOX_ENV-plotting" 2>&1 | tee plotting-test.log

      - name: Upload failure summary
        if: failure() && matrix.vtk == 'local'
        uses: $/.github/actions/vtk-master-failure-summary
        with:
          job-name: >-
            ${{ format('{0} / {1}{2}{3}',
              inputs.label,
              matrix.python,
              matrix.vtk && format(', vtk {0}', matrix.vtk) || '',
              matrix.numpy && format(', numpy {0}', matrix.numpy) || '') }}
          artifact-suffix: ${{ inputs.label }}-${{ env.TOX_ENV }}

      - name: Upload Images for Failed Tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed_test_images-${{ inputs.label }}-${{ env.TOX_ENV }}
          path: _failed_test_images

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated_test_images-${{ inputs.label }}-${{ env.TOX_ENV }}
          path: _generated_test_images

      - name: Upload coverage reports
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage_reports-${{ inputs.label }}-${{ env.TOX_ENV }}
          path: coverage*.xml
          if-no-files-found: error
