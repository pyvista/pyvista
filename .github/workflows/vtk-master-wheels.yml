name: Build/Test VTK Master Wheels

permissions:
  actions: read
  contents: read

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  pull_request:

env:
  ALLOW_PLOTTING: true
  SHELLOPTS: "errexit:pipefail"
  TOX_COLORED: "yes"
  CACHE_FOLDER_NAME: pyvista-data
  PYVISTA_VTK_DATA: ${{ github.workspace }}/pyvista-data

jobs:
  check-should-run:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run:
          | # For PRs, only run this job if the 'vtk-master-testing' label is applied
          echo "run=${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'vtk-master-testing') }}" >> "$GITHUB_OUTPUT"

  build-vtk:
    needs: check-should-run
    if: needs.check-should-run.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout VTK master (pinned to nightly date-stamp commit)
        shell: bash
        run: |
          # Depth 200 since we want to ensure we capture kwrobot's date-stamp commit
          git clone --depth 200 --branch master https://github.com/kitware/vtk vtk-src
          cd vtk-src

          NIGHTLY_SHA="$(git log --grep='^VTK Nightly Date Stamp$' -n 1 --format=%H)"
          if [ -z "$NIGHTLY_SHA" ]; then
            echo "No 'VTK Nightly Date Stamp' commit found in the last 200 commits on master"
            exit 1
          fi

          echo "Pinning build to VTK's nightly date-stamp commit: $NIGHTLY_SHA"
          git checkout "$NIGHTLY_SHA"
          echo "VTK_NIGHTLY_SHA=$NIGHTLY_SHA" >> "$GITHUB_ENV"

          # Record every commit since the *previous* nightly date-stamp, grouped by merge
          # topic (VTK merges each topic branch as a single first-parent merge commit, so
          # the second parent of each merge is that topic's own commit history), so a
          # failure report can point at exactly what landed on VTK master in between.
          PREV_NIGHTLY_SHA="$(git log --grep='^VTK Nightly Date Stamp$' --skip=1 -n 1 --format=%H)"
          BASE_URL="https://gitlab.kitware.com/vtk/vtk/-/commit"
          {
            if [ -z "$PREV_NIGHTLY_SHA" ]; then
              echo "Could not find a previous nightly date-stamp commit within the last 200 commits;"
              echo "showing only the pinned commit: [\`${NIGHTLY_SHA:0:8}\`](${BASE_URL}/${NIGHTLY_SHA})"
            else
              n_commits="$(git rev-list --count "${PREV_NIGHTLY_SHA}..${NIGHTLY_SHA}")"
              echo "Commits since the previous nightly date-stamp ([\`${PREV_NIGHTLY_SHA:0:8}\`](${BASE_URL}/${PREV_NIGHTLY_SHA})):"
              echo
              echo "[Compare on GitLab](https://gitlab.kitware.com/vtk/vtk/-/compare/${PREV_NIGHTLY_SHA}...${NIGHTLY_SHA})"
              echo
              echo "<details>"
              echo "<summary>${n_commits} commits (grouped by merge topic)</summary>"
              echo
              git log --first-parent --reverse --format='%H%x09%h%x09%s%x09%an' \
                "${PREV_NIGHTLY_SHA}..${NIGHTLY_SHA}" |
                while IFS=$'\t' read -r full short subject author; do
                  echo "- [\`${short}\`](${BASE_URL}/${full}) ${subject} (${author})"
                  read -r -a parents <<<"$(git log -1 --format='%P' "$full")"
                  if [ "${#parents[@]}" -ge 2 ]; then
                    # Second parent is the topic branch tip; list what it added over the mainline.
                    git log --no-merges --reverse --format='%H%x09%h%x09%s%x09%an' \
                      "${parents[0]}..${parents[1]}" |
                      while IFS=$'\t' read -r sfull sshort ssubject sauthor; do
                        echo "  - [\`${sshort}\`](${BASE_URL}/${sfull}) ${ssubject} (${sauthor})"
                      done
                  fi
                done
              echo
              echo "</details>"
            fi
          } > "$GITHUB_WORKSPACE/vtk-commit-range.md"

      - name: Upload VTK commit range
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: vtk-commit-range-${{ runner.os }}
          path: vtk-commit-range.md

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            libx11-dev \
            libxt-dev \
            libgl1-mesa-dev \
            libxcursor-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Install build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install ninja matplotlib
          if [ "$RUNNER_OS" = "Linux" ]; then pip install auditwheel; fi
          if [ "$RUNNER_OS" = "macOS" ]; then pip install delocate; fi
          if [ "$RUNNER_OS" = "Windows" ]; then pip install delvewheel; fi

      - name: Set compiler launcher
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          else
            echo "COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          fi

      - name: Configure ccache (Linux & macOS)
        if: runner.os != 'Windows'
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache (Linux & macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vtk-nightly-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vtk-nightly-ccache-${{ runner.os }}-

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Set up sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

      - name: Enable sccache GHA backend (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          mkdir vtk-build && cd vtk-build

          cmake_args=(
            -GNinja
            -DCMAKE_BUILD_TYPE=Release
            -DVTK_WHEEL_BUILD=ON
            -DVTK_WRAP_PYTHON=ON
            -DVTK_BUILD_TESTING=OFF
            -DVTK_BUILD_DOCUMENTATION=OFF
            -DVTK_BUILD_EXAMPLES=OFF
            -DVTK_VERSION_SUFFIX=dev0+g${VTK_NIGHTLY_SHA:0:8}
            -DPython3_EXECUTABLE=$(python -c "import sys; print(sys.executable)")
            -DCMAKE_C_COMPILER_LAUNCHER=$COMPILER_LAUNCHER
            -DCMAKE_CXX_COMPILER_LAUNCHER=$COMPILER_LAUNCHER
            -DVTK_MODULE_ENABLE_VTK_FiltersParallelDIY2=YES
            -DVTK_MODULE_ENABLE_VTK_RenderingMatplotlib=YES
            -DVTK_MODULE_ENABLE_VTK_IOImport=YES
            -DVTK_MODULE_ENABLE_VTK_IOParallelExodus=YES
            -DVTK_MODULE_ENABLE_VTK_IOXdmf2=YES
            -DVTK_MODULE_ENABLE_VTK_WebCore=YES
            -DVTK_MODULE_ENABLE_VTK_WebGLExporter=YES
            -DVTK_MODULE_ENABLE_VTK_WebPython=YES
            ../vtk-src
          )

          cmake "${cmake_args[@]}"

      - name: Build
        shell: bash
        run: |
          # MSVC in particular dumps huge multi-line warning/template-instantiation
          # traces for VTK's ThirdParty code that overwhelm the Actions log viewer.
          # Stream a filtered view live, but keep the full log to print on failure.
          noisy_pattern=': warning C[0-9]+:|: note:|^[[:space:]]+(with|\[|\])[[:space:]]*$|^[[:space:]]+[A-Za-z_][A-Za-z0-9_]*='
          set +e
          cmake --build vtk-build --parallel 2>&1 | tee build.log | grep -Ev --line-buffered "$noisy_pattern"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::error::VTK build failed (exit $build_status); full unfiltered log follows"
            cat build.log
            exit "$build_status"
          fi

      - name: Show compiler cache statistics
        shell: bash
        run: $COMPILER_LAUNCHER --show-stats

      - name: Build wheel
        shell: bash
        run: |
          cd vtk-build
          if [ "$RUNNER_OS" = "macOS" ]; then
            export _PYTHON_HOST_PLATFORM="macosx-11.0-arm64"
            export ARCHFLAGS="-arch arm64"
          fi
          python setup.py bdist_wheel

      - name: Locate macOS VTK dylibs
        if: runner.os == 'macOS'
        run: |
          cd vtk-build
          LIBDIR="$(dirname "$(find . -name 'libvtksys*.dylib' -print -quit)")"
          if [ -z "$LIBDIR" ]; then
            echo "::error::could not locate libvtksys*.dylib anywhere under vtk-build"
            exit 1
          fi
          echo "Found VTK dylibs in: $LIBDIR"
          echo "VTK_DYLIB_DIR=$LIBDIR" >> "$GITHUB_ENV"

      - name: Repair wheel
        shell: bash
        run: |
          cd vtk-build
          mkdir -p wheelhouse
          case "$RUNNER_OS" in
            Linux)   auditwheel repair dist/*.whl -w wheelhouse/ ;;
            macOS)   DYLD_LIBRARY_PATH="$PWD/$VTK_DYLIB_DIR" delocate-wheel --require-archs arm64 -w wheelhouse -v dist/*.whl ;;
            Windows) delvewheel repair --add-path bin -w wheelhouse dist/*.whl ;;
          esac

      - name: Upload VTK wheel
        uses: actions/upload-artifact@v7
        with:
          name: vtk-wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: vtk-build/wheelhouse/*.whl

  # Cache pyvista/data for each runner separately
  # Runner labels should match the actual runners used by the different jobs in this file

  # GitHub-hosted runners can re-use the cache across OS's.
  # Here we run the cache on ubuntu, but it's usable by windows GitHub runners too
  cache-github-hosted:
    needs: check-should-run
    if: needs.check-should-run.outputs.run == 'true'
    name: Cache pyvista/data
    uses: ./.github/workflows/cache-pyvista-data.yml
    with:
      runs-on: "ubuntu-22.04"

  test-linux:
    needs: [check-should-run, build-vtk, cache-github-hosted]
    if: ${{ !cancelled() && needs.check-should-run.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    env:
      VTK_WHEEL_DIR: ${{ github.workspace }}/vtk-wheel

    steps:
      - name: Checkout PyVista
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Download VTK wheel artifact
        id: download-wheel
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vtk-wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: vtk-wheel

      - name: Skip if wheel build failed
        if: steps.download-wheel.outcome != 'success'
        run: |
          echo "No VTK wheel artifact for ${{ runner.os }}/py${{ matrix.python-version }}"
          exit 1

      # ALL STEPS ABOVE SHOULD BE EXACTLY THE SAME FOR EACH OS
      # ALL STEPS BELOW SHOULD MIMIC THE UNIT TESTING WORKFLOW EXACTLY

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: xvfb libgl1 libglx-mesa0 libosmesa6
          version: 3.0

      - name: Restore pyvista/data cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_FOLDER_NAME }}
          key: ${{ needs.cache-github-hosted.outputs.key }}
          enableCrossOsArchive: true

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Core Testing (no GL)
        run: tox run -e py${{ matrix.python-version }}-core-vtk_local

      - name: Plotting Testing (uses GL)
        if: ${{ !cancelled() }}
        run: xvfb-run tox run -e py${{ matrix.python-version }}-plotting-vtk_local

      - name: Upload Images for Failed Tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
          path: _failed_test_images

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
          path: _generated_test_images

  test-macOS:
    needs: [check-should-run, build-vtk, cache-github-hosted]
    if: ${{ !cancelled() && needs.check-should-run.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    env:
      VTK_WHEEL_DIR: ${{ github.workspace }}/vtk-wheel

    steps:
      - name: Checkout PyVista
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Download VTK wheel artifact
        id: download-wheel
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vtk-wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: vtk-wheel

      - name: Skip if wheel build failed
        if: steps.download-wheel.outcome != 'success'
        run: |
          echo "No VTK wheel artifact for ${{ runner.os }}/py${{ matrix.python-version }}"
          exit 1

      # ALL STEPS ABOVE SHOULD BE EXACTLY THE SAME FOR EACH OS
      # ALL STEPS BELOW SHOULD MIMIC THE UNIT TESTING WORKFLOW EXACTLY

      - name: Restore pyvista/data cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_FOLDER_NAME }}
          key: ${{ needs.cache-github-hosted.outputs.key }}
          enableCrossOsArchive: true

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Core Testing (no GL)
        run: tox run -e py${{ matrix.python-version }}-core-vtk_local

      - name: Plotting Testing (uses GL)
        if: ${{ !cancelled() }}
        run: tox run -e py${{ matrix.python-version }}-plotting-vtk_local

      - name: Upload Images for Failed Tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
          path: _failed_test_images

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
          path: _generated_test_images

  test-windows:
    needs: [check-should-run, build-vtk, cache-github-hosted]
    if: ${{ !cancelled() && needs.check-should-run.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    env:
      VTK_WHEEL_DIR: ${{ github.workspace }}/vtk-wheel

    steps:
      - name: Checkout PyVista
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Download VTK wheel artifact
        id: download-wheel
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vtk-wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: vtk-wheel

      - name: Skip if wheel build failed
        if: steps.download-wheel.outcome != 'success'
        run: |
          echo "No VTK wheel artifact for ${{ runner.os }}/py${{ matrix.python-version }}"
          exit 1

      # ALL STEPS ABOVE SHOULD BE EXACTLY THE SAME FOR EACH OS
      # ALL STEPS BELOW SHOULD MIMIC THE UNIT TESTING WORKFLOW EXACTLY

      - name: Restore pyvista/data cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_FOLDER_NAME }}
          key: ${{ needs.cache-github-hosted.outputs.key }}
          enableCrossOsArchive: true

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Core Testing (no GL)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_on: timeout
          command: tox run -e py${{ matrix.python-version }}-core-vtk_local

      - name: Plotting Testing (uses GL)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        if: ${{ !cancelled() }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: tox run -e py${{ matrix.python-version }}-plotting-vtk_local

      - name: Upload Images for Failed Tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
          path: _failed_test_images

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated_test_images-${{ github.job }}-${{ join(matrix.* , '-') }}
          path: _generated_test_images

  alert-on-failure:
    needs:
      [
        check-should-run,
        build-vtk,
        cache-github-hosted,
        test-linux,
        test-macOS,
        test-windows,
      ]
    if: >-
      failure() &&
      needs.check-should-run.outputs.run == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read # to look up which matrix jobs failed
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download VTK commit range
        id: download-commit-range
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vtk-commit-range-Linux
          path: vtk-commit-range

      - name: Report VTK master wheel failure
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_RANGE_OUTCOME: ${{ steps.download-commit-range.outcome }}
        run: |
          # Individual gh/api lookups below are best-effort (wrapped in `|| true`); a single
          # missing log or issue comment should not abort the whole report.
          set -uo pipefail

          # Ensure the dedup label exists (idempotent).
          gh label create vtk-master-wheel-failure \
            --color cbb230 \
            --description "Tracks the recurring VTK master wheel build/test failure" \
            --force || true

          # The matrix job names include the OS/python-version, e.g. "build-vtk (ubuntu-latest, 3.14)"
          failed_jobs_raw=$(gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | [.databaseId, .name, .url] | @tsv')

          failed_jobs=()
          while IFS=$'\t' read -r job_id name url; do
            [ -n "$job_id" ] || continue
            failed_jobs+=("${job_id}"$'\t'"${name}"$'\t'"${url}")
          done <<< "$failed_jobs_raw"

          jobs_list=""
          failure_sections=""

          if [ "${#failed_jobs[@]}" -eq 0 ]; then
            jobs_list="- (could not determine which jobs failed, see the run)"$'\n'
          else
            for row in "${failed_jobs[@]}"; do
              IFS=$'\t' read -r job_id name url <<< "$row"
              jobs_list+="- [\`${name}\`](${url})"$'\n'

              # Pull the job log and try to isolate a useful failure summary: a pytest
              # short-summary section, or the marker the Build step prints on a VTK build
              # failure, falling back to the tail of the log if neither is found.
              log="$(gh api "repos/${GH_REPO}/actions/jobs/${job_id}/logs" 2>/dev/null || true)"
              if [ -z "$log" ]; then
                summary="(could not retrieve the log for this job)"
              else
                start_line="$(printf '%s\n' "$log" | grep -n -m1 -E '=+ short test summary info =+|^::error::VTK build failed' | head -n1 | cut -d: -f1)"
                if [ -n "$start_line" ]; then
                  summary="$(printf '%s\n' "$log" | tail -n "+${start_line}" | tail -c 8000)"
                else
                  summary="$(printf '%s\n' "$log" | tail -c 8000)"
                fi
              fi

              hash="$(printf '%s' "$summary" | sha256sum | cut -d' ' -f1)"

              # The HTML comment marker records this job's failure signature so a later run
              # can detect "same failure as before" without any external state.
              failure_sections+="<!-- failure-hash:${name}:${hash} -->"$'\n'
              failure_sections+="<details>"$'\n'
              failure_sections+="<summary>❌ ${name} — failure output</summary>"$'\n\n'
              failure_sections+='```text'$'\n'"${summary}"$'\n''```'$'\n'
              failure_sections+="</details>"$'\n\n'
            done
          fi
          [ -n "$jobs_list" ] || jobs_list="- (could not determine which jobs failed, see the run)"$'\n'

          if [ "$COMMIT_RANGE_OUTCOME" = "success" ] && [ -f vtk-commit-range/vtk-commit-range.md ]; then
            commit_range_body="$(cat vtk-commit-range/vtk-commit-range.md)"
          else
            commit_range_body="(could not determine which VTK commits landed since the previous nightly)"
          fi

          # Check for an existing open issue, and compare each failed job's signature
          # against the most recently posted report (the last comment, or the issue body
          # if there are no comments yet).
          existing=$(gh issue list --label "vtk-master-wheel-failure" --state open --limit 1 --json number --jq '.[0].number // empty')

          repeat_note=""
          if [ -n "$existing" ]; then
            prev_text="$(gh issue view "$existing" --json body,comments \
              --jq 'if (.comments | length) > 0 then .comments[-1].body else .body end' 2>/dev/null || true)"
            prev_url="$(gh issue view "$existing" --json url,comments \
              --jq 'if (.comments | length) > 0 then .comments[-1].url else .url end' 2>/dev/null || true)"
            for row in "${failed_jobs[@]}"; do
              IFS=$'\t' read -r job_id name url <<< "$row"
              cur_hash="$(printf '%s' "$failure_sections" | grep -F "failure-hash:${name}:" | tail -n1 | sed -E 's/.*failure-hash:[^:]+:([0-9a-f]+).*/\1/')"
              prev_hash="$(printf '%s' "$prev_text" | grep -F "failure-hash:${name}:" | tail -n1 | sed -E 's/.*failure-hash:[^:]+:([0-9a-f]+).*/\1/')"
              if [ -n "$cur_hash" ] && [ -n "$prev_hash" ] && [ "$cur_hash" = "$prev_hash" ]; then
                repeat_note+="- \`${name}\`: same failure signature as the [previous report](${prev_url})."$'\n'
              fi
            done
          fi
          [ -z "$repeat_note" ] || repeat_note="**Repeat failures:**"$'\n'"${repeat_note}"

          body=$(cat <<EOF
          ### VTK Master Wheel Failure

          **Date:** $(date -u +%Y-%m-%d)
          **Run:** ${RUN_URL}

          **Failing jobs:**
          ${jobs_list}
          ${repeat_note}
          ${commit_range_body}

          ${failure_sections}
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "VTK master wheel failure" --label "vtk-master-wheel-failure" --body "$body"
          fi
