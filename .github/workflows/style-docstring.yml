# check spelling, codestyle
name: Style and Docstring Check

on: [pull_request, merge_group, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: none

jobs:
  cache-pyvista-data:
    name: Cache pyvista/data
    uses: ./.github/workflows/cache-pyvista-data.yml
    with:
      # Runner should match the actual runner used by the docstring job
      runs-on: "blacksmith-4vcpu-ubuntu-2204"

  docstringcheck:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2204
            python-version: "3.14" # Should be the latest version supported
          - os: windows-latest
            python-version: "3.10" # Should be the oldest version supported

    runs-on: ${{ matrix.os }}

    needs: cache-pyvista-data
    env:
      TOX_COLORED: "yes"
      PYVISTA_VTK_DATA: ${{ github.workspace }}/pyvista-data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup headless display on Windows
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        if: runner.os == 'Linux'
        with:
          packages: xvfb libgl1 libglx-mesa0 libosmesa6
          version: 3.0

      - name: Restore pyvista/data cache
        uses: actions/cache/restore@v6
        with:
          path: pyvista-data
          key: ${{ needs.cache-pyvista-data.outputs.key }}
          enableCrossOsArchive: true

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Test Package Docstrings (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a tox run -f doctest

      - name: Test Package Docstrings (Windows)
        if: runner.os == 'Windows'
        run: tox run -f doctest

  vale:
    name: Vale
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install Vale Dependencies
        run: pip install 'docutils<0.22' 'sphinx-gallery<0.22.0'

      # Convert .py examples to .rst so Vale can parse their headings.
      - name: Extract example RST for Vale
        run: python3 doc/extract_example_rst.py examples .vale-examples-rst

      # this is equivalent to
      # vale --config doc/.vale.ini doc pyvista examples CONTRIBUTING.rst .vale-examples-rst
      # errata-ai/vale-action was renamed to vale-cli/vale-action; pinned to the v3.0.0 tag
      - name: "Run Vale"
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: '["doc", "pyvista", "examples", "CONTRIBUTING.rst", ".vale-examples-rst"]'
          config: doc/.vale.ini
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
