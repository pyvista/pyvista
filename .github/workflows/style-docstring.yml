# check spelling, codestyle
name: Style and Docstring Check

on: [pull_request, merge_group, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: none

jobs:
  # GitHub-hosted runners can re-use the cache across OS's, so this ubuntu
  # entry serves the Windows job via enableCrossOsArchive on the restore.
  cache-pyvista-data:
    name: Cache pyvista/data
    uses: $/.github/workflows/cache-pyvista-data.yml
    with:
      runs-on: "ubuntu-22.04"

  docstringcheck:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.14" # Should be the latest version supported
          - os: windows-latest
            python-version: "3.11" # Should be the oldest version supported
          - os: macos-latest
            python-version: "3.14"
            # Apple's software renderer is slow, so skip rendering in show()
            skip-show: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: cache-pyvista-data
    env:
      TOX_COLORED: "yes"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        if: runner.os == 'Linux'
        with:
          packages: libosmesa6
          version: 3.0

      - name: Restore pyvista/data cache
        uses: $/.github/actions/restore-pyvista-data
        with:
          key: ${{ needs.cache-pyvista-data.outputs.key }}

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Test Package Docstrings
        run: tox run -e doctest-modules
        env:
          _PYVISTA_DOCTEST_SKIP_SHOW: ${{ matrix.skip-show || false }}

  doctest-names:
    name: Doctest Names
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TOX_COLORED: "yes"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" # Should be the latest version supported
          cache: pip

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: libgl1 libglx-mesa0
          version: 3.0

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Check Docstring Example Names
        run: tox run -e doctest-names

  vale:
    name: Vale
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # For the `github-pr-check` reporter's check run.
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install Vale
        run: |
          VALE_VERSION="$(python3 doc/run_vale.py --print-vale-version)"
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin -f vale.tar.gz vale
        env:
          # From vale_<version>_checksums.txt on the release page, for VALE_VERSION in
          # doc/run_vale.py; update both together.
          VALE_SHA256: 52f5cd0314a1b7384cac6aa102a68193977312f6ba9c9f3ae001b5deec8e3a10

      - name: Install Vale Dependencies
        run: pip install 'docutils<0.22' 'sphinx-gallery<0.22.0'

      # Convert .py examples to .rst so Vale can parse their headings.
      - name: Extract example RST for Vale
        run: python3 doc/extract_rst_from_py_for_vale.py examples .vale/examples

      # Same, for docstrings, so Vale can check their prose too.
      - name: Extract docstring RST for Vale
        run: python3 doc/extract_rst_from_py_for_vale.py pyvista .vale/pyvista --mode docstrings

      # `doc/run_vale.py` owns the path list; Vale runs here through the action
      # instead, so that alerts appear inline on the pull request.
      - name: Collect the paths Vale checks
        id: vale-paths
        run: echo "files=$(python3 doc/run_vale.py --print-files)" >> "$GITHUB_OUTPUT"

      - name: "Run Vale"
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: ${{ steps.vale-paths.outputs.files }}
          config: doc/.vale.ini
          reporter: github-pr-check
          filter_mode: nofilter
          version: none
          # Otherwise vale-action passes the job once reviewdog hits GitHub's annotation limit.
          fail_on_error: true
          # Suggestion-level noise is filtered out by MinAlertLevel in doc/.vale.ini.
          fail_level: warning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Scanned files have to pass, so nothing above would notice a rule going
      # slack. This runs Vale over fixtures of text that must be flagged, and
      # fails if any of it stops being.
      - name: "Check Vale still catches known-bad text"
        run: python3 tests/doc/vale/check_expected_failures.py
