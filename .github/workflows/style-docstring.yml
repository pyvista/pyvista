# check spelling, codestyle
name: Style and Docstring Check

on: [pull_request, merge_group, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: none

jobs:
  # GitHub-hosted runners can re-use the cache across OS's, so this ubuntu
  # entry serves the Windows job via enableCrossOsArchive on the restore.
  cache-pyvista-data:
    name: Cache pyvista/data
    uses: $/.github/workflows/cache-pyvista-data.yml
    with:
      runs-on: "ubuntu-22.04"

  docstringcheck:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.14" # Should be the latest version supported
          - os: windows-latest
            python-version: "3.10" # Should be the oldest version supported

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: cache-pyvista-data
    env:
      TOX_COLORED: "yes"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup headless display on Windows
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        if: runner.os == 'Linux'
        with:
          packages: xvfb libgl1 libglx-mesa0 libosmesa6
          version: 3.0

      - name: Restore pyvista/data cache
        uses: $/.github/actions/restore-pyvista-data
        with:
          key: ${{ needs.cache-pyvista-data.outputs.key }}

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Test Package Docstrings (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a tox run -e doctest-modules

      - name: Test Package Docstrings (Windows)
        if: runner.os == 'Windows'
        run: tox run -e doctest-modules

  doctest-names:
    name: Doctest Names
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TOX_COLORED: "yes"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14" # Should be the latest version supported
          cache: pip

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: libgl1 libglx-mesa0
          version: 3.0

      - name: Install tox-uv
        run: pip install tox-uv

      - name: Check Docstring Example Names
        run: tox run -e doctest-names

  vale:
    name: Vale
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install Vale Dependencies
        run: pip install 'docutils<0.22' 'sphinx-gallery<0.22.0'

      # Pinned and checksummed rather than installed by `vale-action`, which
      # downloads both Vale and reviewdog from GitHub releases on every run.
      - name: Install Vale
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin -f vale.tar.gz vale
        env:
          VALE_VERSION: 3.18.0
          # From vale_<version>_checksums.txt on the release page; update both together.
          VALE_SHA256: a6f71a75a12fe689345b754f2412b90367fe33648abb7d200fa19eaadc2dbf6d

      # Extracts the .rst Vale reads, lints every path, and checks that the rules
      # still reject the fixtures in `tests/doc/vale`; `--annotate` reports each
      # alert as an annotation on the pull request.
      - name: Run Vale
        run: python3 doc/run_vale.py --annotate
